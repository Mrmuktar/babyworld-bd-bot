services:
  - type: web
    name: babyworld-bd-premium-order-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_NUMBER
        sync: false
      - key: DATA_DIR
        value: /tmp/babyworld-bd-data
      - key: STEADFAST_API_KEY
        sync: false
      - key: STEADFAST_SECRET_KEY
        sync: false
      - key: STEADFAST_API_URL
        value: https://portal.packzy.com/api/v1/create_order
