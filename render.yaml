services:
  - type: web
    name: babyworld-bd-whatsapp-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_NUMBER
        sync: false
      - key: DATA_DIR
        value: /data
      - key: PORT
        value: 10000
    disk:
      name: babyworld-bd-data
      mountPath: /data
      sizeGB: 1
